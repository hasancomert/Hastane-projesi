  - arazi_osm_geoboundaries_tur
  derivation: OSM (2026-06-26T20:21:00Z) araç yolu ağında 4.761 köken–hedef çifti; köken ∝ GHS-POP 2025 nüfusu,
    her mesafe bandından bir hedef ∝ nüfus; ağ mesafesi (Dijkstra, yönlü, tek yön kuralları) / bağlanan düğümler
    arası kuş uçuşu (EPSG:32636); hücreler en yakın motorway/trunk dışı yol düğümüne bağlandı. Değer = kuş uçuşu
    5–40 km çiftlerinin nüfus ağırlıklı ortalaması (n = 2.394, w = kökenin bant içi nüfusu). Aynı bantta ortanca
    1,218, ağırlıksız ortalama 1,247, nüfus ağırlıklı oranlar toplamı Σw·ağ/Σw·kuş = 1,206, kapıdan kapıya (bağlantı
    mesafeleri dahil, hücre merkezine göre) 1,229.
  rationale: Hastane yolculuklarının çoğu hücreden en yakın hastaneye 5–40 km aralığında (R varsayılanı 30 km);
    çok kısa (<5 km) çiftlerde katsayı kent içi blok yapısı nedeniyle yüksek, uzun çiftlerde düşük. Model d_ij =
    kuş uçuşu × k kullandığı için bu banttaki nüfus ağırlıklı ortalama seçildi.
  range:
  - 1.0
  - 1.5
