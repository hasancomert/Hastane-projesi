- key: access.horizon_years
  label: "Planlama ufku (T)"
  value: 25
  unit: "yıl"
  status: model_secimi
  source_ids: [erisim_tbmm_haber_saglik_butce_2024, erisim_haber_diken_536163, erisim_mevzuat_6428, maliyet_savas_2020]
  rationale: >-
    MODEL SEÇİMİ: planlama ufku olarak şehir hastanesi KÖİ sözleşme süresi (25 yıl) kullanıldı. Kaynaklı olan sözleşme
    süresidir (Sağlık Bakanı, TBMM PBK 10.11.2023; Diken [27]: Bilkent ödemeleri 2019–2043; Savaş vd. 2020); bu sürenin
    erişim maliyetlerinin bugünkü değeri için ufuk alınması bizim tercihimizdir. Hastane binasının fiziksel ömrü daha
    uzundur ve bağlayıcı bir resmî değerlendirme dönemi bulunamadı; 30 yıl (6428 md. 4 üst sınırı), 20 yıl (ulaştırma
    projelerinde yaygın dönem) ve 15,5 yıl (kesintiler sonrası kalan süre) alternatif olarak gösterilir.
  range: [5, 50]
  alternatives:
    - {label: "6428 sayılı Kanun md. 4: KÖİ sözleşmesi üst sınırı (yatırım dönemi hariç)", value: 30, status: kaynakli, source_ids: [erisim_mevzuat_6428]}
    - {label: "Ulaştırma projelerinde en yaygın değerlendirme dönemi", value: 20, status: kaynakli, source_ids: [erisim_bagdatli_akbiyikli_2015]}
    - {label: "Şehir hastanelerinde kesintiler sonrası ortalama kalan ödeme süresi ('15-16 yıl', 2023)", value: 15.5, status: hesap, source_ids: [erisim_tbmm_haber_saglik_butce_2024]}
  notes: >-
    SÖZLEŞME SÜRESİ DOĞRULANDI: şehir hastanesi KÖİ sözleşmeleri 25 yıl — Sağlık Bakanı, TBMM PBK 10.11.2023: '25 yıllık sözleşme
    sürelerini kesmediğimiz bir şehir hastanesi olmadı'; Diken [27]: Bilkent ödemeleri 2019–2043 (25 yıl); Savaş vd. 2020
    (maliyet_savas_2020, s. 2): '25 yıl sonra işletme kamuya kalır'. Yasal üst sınır 30 yıl + yatırım dönemi (6428 md. 4).
    Bakanın aynı konuşmasına göre sözleşmeler sonradan kısaltıldı (İzmir −10 yıl 3 ay, Etlik −7 yıl 8 ay, Bilkent −3 yıl
    1 ay; ortalama kalan 15–16 yıl). Faz 1 temizliğinde durum 'kaynakli' → 'model_secimi' yapıldı: kaynak sözleşme
    süresini verir, planlama ufku olarak kullanılması bizim tercihimizdir.

- key: access.discount_rate
  label: "Sosyal iskonto oranı (r, reel)"
  value: 0.05
  unit: "oran / yıl (reel)"
  status: model_secimi
  source_ids: [erisim_kalayci_oflaz_2022, yatirim_rehber_2026_2028]
  rationale: >-
    MODEL SEÇİMİ: Türkiye'de bağlayıcı resmî bir sosyal iskonto oranı yok — SBB 2026-2028 Yatırım Programı Hazırlama
    Rehberi (md. 54) 'ekonomik analizde kullanılacak iskonto oranı … güncel veriler kullanılarak hesaplanacaktır' diyor.
    %5, Avrupa Komisyonu 'Guide to Cost-Benefit Analysis of Investment Projects 2014–2020' rehberinin uyum (cohesion)
    ülkelerindeki büyük projeler için önerdiği orandır; değer rehberin aslından değil, Kalaycı Oflaz (2022, s. 398)
    derlemesindeki ikincil aktarımdan alındı (ec.europa.eu bu ortamdan erişilemedi). Aynı derlemedeki Türkiye sosyal
    zaman tercihi tahmini %5,06 (Halıcıoğlu ve Karataş 2011) ile uyumludur. Kalkınma Bakanlığı'nın tek resmî tahmini
    olan %9,8 ekonomik indirgeme oranı (Uzunkaya ve Uzunkaya 2012; sermayenin fırsat maliyeti yaklaşımı) alternatif
    olarak görünür tutulur.
  range: [0.0, 0.12]
  alternatives:
    - {label: "AB CBA rehberi 2014–2020, uyum ülkesi olmayan üye devletler; WHO sağlık değerlendirmeleri", value: 0.03, status: kaynakli, source_ids: [erisim_kalayci_oflaz_2022]}
    - {label: "Türkiye sosyal zaman tercihi oranı (Halıcıoğlu ve Karataş 2011)", value: 0.0506, status: kaynakli, source_ids: [erisim_kalayci_oflaz_2022]}
    - {label: "Yurt içi tasarrufların ortalama getirisi 1987–2006 (Kalkınma Bakanlığı)", value: 0.06, status: kaynakli, source_ids: [erisim_uzunkaya_2012]}
    - {label: "Türkiye ulaştırma projelerinde son uygulama (≈%8)", value: 0.08, status: kaynakli, source_ids: [erisim_bagdatli_akbiyikli_2015]}
    - {label: "Türkiye ekonomik indirgeme oranı 1987–2006 (Kalkınma Bakanlığı; duyarlılık %9,0–11,9)", value: 0.098, status: kaynakli, source_ids: [erisim_uzunkaya_2012]}
  notes: >-
    Faz 1 temizliğinde durum 'kaynakli' → 'model_secimi' yapıldı: %5 Türkiye için bağlayıcı bir değer değil, AB
    rehberinin uyum ülkeleri oranının ikincil aktarımıdır. ÖĞRENCİ KARARI: %5 (sosyal zaman tercihi) mi, %9,8 (Türkiye
    ekonomik indirgeme oranı, Uzunkaya ve Uzunkaya 2012) mı? PV(25 yıl) = 14,09 (%5) / 9,22 (%9,8) / 17,41 (%3).
    Oran reel olduğundan tüm maliyetler sabit 2026 fiyatlarıyla kullanılmalı.

- key: access.alpha
  label: "Mesafe üssü (α)"
  value: 1
  unit: "boyutsuz"
  status: model_secimi
  rationale: >-
    α = 1 erişim maliyetini mesafeyle doğrusal kılar (toplam yolculuk maliyeti = verimlilik ölçütü; λ'nın TL/kişi·km
    birimi ancak α = 1'de doğrudan para cinsindendir). α > 1 uzak mesafeleri orantısız cezalandırır (eşitlik ayarı,
    şartname 4.1 ve 4.4 G); bu durumda amaç terimi artık TL değil, 'eşitlik ağırlıklı' bir ölçüdür.
  range: [1.0, 3.0]

- key: access.max_distance_km
  label: "Azami erişim mesafesi (R, yol mesafesi)"
  value: 30
  unit: "km (yol; d_ij = kuş uçuşu_ij × k(kuş uçuşu_ij) × access.circuity_scale)"
  status: varsayim
  rationale: >-
    İkinci basamak hastaneler için Türkiye'de resmî bir erişim mesafesi/süresi standardı bulunamadı: Kamu Sağlık
    Tesisleri Ruhsatlandırma Yönetmeliği (erisim_mevzuat_33805_ruhsatlandirma) ve Mekânsal Planlar Yapım Yönetmeliği
    EK-2 (maliyet_mpyy_ek2; yalnız m²/yatak alan standardı) mesafe ölçütü içermiyor; Sağlık Bakanlığı 'Yataklı Sağlık
    Tesisleri Planlama Rehberi' ve rol tanımlama belgelerine bu ortamdan erişilemedi. Şartname varsayılanı 30 km korunur.
    Süre karşılığı: 30 km / 28,5 km/sa ≈ 63 dk (TomTom ortalaması), serbest akışta (44,4 km/sa) ≈ 41 dk. Yol mesafesi
    varsayılan olarak mesafeye bağlı dolambaç profiliyle hesaplanır (access.circuity_mode = mesafeye_bagli,
    access.circuity_profile, ölçek 1,0): R = 30 yol km ≈25,0 km kuş uçuşuna karşılık gelir ('sabit' modunda
    30 / 1,223 ≈ 24,5 km; ters hesap backend/model/distance.py euclid_for_road_km, grid_summary.json 'circuity').
    Kalibre ızgarada kapsama denetimi (pipeline/22_grids.py, data/processed/grid/grid_summary.json; varsayılan aday
    kuralı, P_min = 250, WorldPop 2025): 3 km ve 5 km ızgarada her talep hücresinin R içinde en az bir adayı var; 2 km
    ızgarada 4 talep hücresi (33 kişi) adaysız kaldı ve kapsama onarımı 1 uygun hücreyi aday yaptı. R ile P_min birlikte
    seçilmeli: R küçülürse onarımla eklenen aday sayısı artar.
  range: [10, 100]
  alternatives:
    - {label: "Kentsel alt sınır (varsayım; kaynak yok)", value: 15, status: varsayim}
    - {label: "Kırsal üst sınır (varsayım; kaynak yok)", value: 50, status: varsayim}
  notes: >-
    Kentsel/kırsal ayrı R destekleyen resmî bir kaynak bulunamadı; ayrım istenirse ilçe/hücre yoğunluğuna göre iki
    değer (ör. 15/50 km) varsayım olarak etiketlenmeli. R kapsama alt sınırını (LSCP) doğrudan belirler; küçük R çok
    hastane gerektirir.
