  unit: "km / saat"
  status: hesap
  source_ids: [erisim_haber_yeniankara_tomtom_2025]
  derivation: "TomTom Trafik Endeksi 2025, Ankara: 10 km ortalama yolculuk 21 dk 3 sn → 10 / (21,05/60) = 28,50 km/sa"
  range: [15, 80]
  alternatives:
    - {label: "Yoğun saat ortalama hızı (TomTom 2025)", value: 20.9, status: kaynakli, source_ids: [erisim_haber_yeniankara_tomtom_2025]}
    - {label: "Akşam yoğun saat ortalama hızı (TomTom 2025)", value: 19.5, status: kaynakli, source_ids: [erisim_haber_yeniankara_tomtom_2025]}
