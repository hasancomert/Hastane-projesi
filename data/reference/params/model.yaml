# Alan: model — Faz 3 optimizasyon çekirdeğinin model seçimi parametreleri (şartname 4.4 A, B, I; 4.5 isteğe bağlı
# kısıtlar). Hepsi modelleme tercihi (model_secimi); kaynaktan gelen bir sayı yok. Kullanan kod: backend/model/params.py.
# "0 = sınır yok" kuralı: kayıt şeması değer alanının boş olmasına izin vermediği için sayı sınırlarında 0 kullanılır.

- key: population.scenario_year
  label: "Nüfus senaryosu (yıl)"
  value: 2025
  unit: "yıl (seçenek: 2025 | 2030)"
  status: model_secimi
  rationale: >-
    Şartname 4.4 A: nüfus senaryosu 2025 (TÜİK kalibre) varsayılan, 2030 isteğe bağlı. 2025 hücre nüfusları ilçe
    bazında TÜİK 2025'e birebir kalibredir (il toplamı 5.910.320); 2030 senaryosu TÜİK il projeksiyonunu
    (population.province_2030) seçilen kaynağın 2030 dağılımıyla hücrelere böler (pipeline/22_grids.py).
  alternatives:
    - {label: "2030 senaryosu (TÜİK il projeksiyonu, kaynak ızgarasının 2030 dağılımı)", value: 2030, status: model_secimi}

- key: demand.mode
  label: "Yatak talebi yöntemi"
  value: oran
  unit: "seçenek (oran | hill_burton)"
  status: model_secimi
  rationale: >-
    Şartname 4.4 A iki yöntem tanımlar: (1) oran — yatak = nüfus × demand.beds_per_1000 / 1000; (2) Hill-Burton —
    yatak = nüfus × yatış oranı × ortalama kalış / (365 × hedef doluluk). Varsayılan oran yöntemidir (şartnamenin ilk
    modu; gözlenen Türkiye yatak/nüfus oranı). Kapasite emniyet payı (demand.safety_margin) her iki yöntemde de talebi
    (1 + pay) ile çarpar; varsayılan pay 0 olduğundan varsayılan sonucu etkilemez.
  alternatives:
    - {label: "Hill-Burton (varsayılan girdilerle ≈2,04 yatak / 1000 kişi)", value: hill_burton, status: model_secimi}

- key: size.city_enabled
  label: "Şehir hastanesi sınıfı (V-D) açık mı?"
  value: true
  unit: "evet/hayır"
  status: model_secimi
  rationale: >-
    Şartname 4.4 B: şehir hastanesi sınıfı aç/kapa. Varsayılan açık: model şehir hastanesini seçip seçmeyeceğine
    maliyetlere göre kendisi karar verir (V-D birim maliyeti ve yatak başı alanı en yüksek sınıftır; şartname 4.2).
    Kapatılırsa en büyük hastane size.general_max_beds olur ve kapasite alt sınırı yükselir.
  alternatives:
    - {label: "Kapalı (yalnız genel hastaneler)", value: false, status: model_secimi}

- key: size.min_hospitals
  label: "En az hastane sayısı (0 = sınır yok)"
  value: 0
  unit: "hastane"
  status: model_secimi
  rationale: >-
    Şartname 4.4 B: isteğe bağlı en az / en çok hastane sayısı. Varsayılan sınır yok (0): sayıyı maliyet ve nüfus
    belirler. Değer verilirse Σ_j Σ_k y_jk ≥ değer kısıtı eklenir.
  range: [0, 300]

- key: size.max_hospitals
  label: "En çok hastane sayısı (0 = sınır yok)"
  value: 0
  unit: "hastane"
  status: model_secimi
  rationale: >-
    Şartname 4.4 B: isteğe bağlı üst sınır. Varsayılan sınır yok (0). Değer verilirse Σ_j Σ_k y_jk ≤ değer; kapasite
    alt sınırının (⌈toplam yatak talebi / en büyük sınıfın üst sınırı⌉) altında bir değer modeli olurlu olmaktan çıkarır.
  range: [0, 300]

- key: solver.objective_mode
  label: "Amaç modu"
  value: toplam
  unit: "seçenek (toplam | butce | sabit_p)"
  status: model_secimi
  rationale: >-
    Şartname 4.4 I: (1) toplam — açılış + erişim maliyetinin toplamını en aza indir (varsayılan); (2) butce — açılış
    maliyeti solver.budget_tl'yi aşmadan erişim maliyetini en aza indir; (3) sabit_p — hastane sayısı solver.p_fixed'e
    eşitken toplam maliyeti en aza indir (U eğrisi taraması da bu modu kullanır).
  alternatives:
    - {label: "Bütçe sınırı altında erişim maliyetini en aza indir", value: butce, status: model_secimi}
    - {label: "Hastane sayısı p sabitken en iyi konum ve boyutlar", value: sabit_p, status: model_secimi}

- key: solver.budget_tl
  label: "Açılış bütçesi (yalnız bütçe modunda)"
  value: 350000000000
  unit: "TL (2026 fiyatları; açılış = inşaat + sabit + arsa [+ işletme], KDV ayarına göre)"
  status: model_secimi
  rationale: >-
    Bütçe modunun (amaç: erişim maliyeti) varsayılanı, varsayılan senaryonun (3 km ızgara, toplam modu, Faz 3 temel
    çözümü data/processed/solver_baseline.json) açılış maliyetinin (345,25 milyar TL; gap %0,16) yukarı
    yuvarlanmışıdır: mod açıldığında model aynı büyüklükte bir bütçeyle erişimin ne kadar iyileşebileceğini gösterir.
    Bütçe, toplam yatak talebini karşılamanın en düşük açılış maliyetinin altına inerse model olurlu değildir (ön
    denetim Türkçe mesaj verir). Kaynaklı bir bütçe değeri değildir.
  range: [0, 1000000000000]
  notes: >-
    Varsayılanlarla en düşük açılış maliyeti için kaba alt sınır: 18.617,5 yatak × en ucuz yatak (15,54 milyon TL) +
    gereken en az hastane × en ucuz sabit maliyet (478,7 milyon TL) ≈ 291,7 milyar TL. Temel çözümün açılış maliyeti
    (345,25 milyar TL) bundan büyüktür, çünkü erişim için çok sayıda küçük hastane açılır.

- key: solver.p_fixed
  label: "Sabit hastane sayısı p (yalnız sabit_p modunda)"
  value: 89
  unit: "hastane"
  status: model_secimi
  rationale: >-
    Sabit-p modunun varsayılanı, varsayılan senaryonun (3 km ızgara, toplam modu) Faz 3 temel çözümündeki hastane
    sayısıdır (89; data/processed/solver_baseline.json, gap %0,16): mod açıldığında başlangıç noktası serbest p'li
    çözümle karşılaştırılabilir; U eğrisi taraması p'yi bunun çevresinde değiştirir. Kaynaklı bir değer değildir.
  range: [1, 300]
