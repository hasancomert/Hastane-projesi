  notes: >-
    REGRESYON (statsmodels OLS, ana örneklem n = 61, Sağlık Bakanlığı tek binalı yeni hastane projeleri, bütçe
    finansmanlı şehir hastaneleri dahil): F0 = −142.000.683 TL (SE 441.950.773; HC3-SE 1.310.083.204),
    v = 14.784.989 TL/yatak (SE 544.985; %95 GA 13.694.478 … 15.875.501), R² = 0,926 (düz. 0,925).
    Etkili gözlem: İstanbul Sancaktepe Şehir Hastanesi 1. Etap (4.050 yatak; Cook D = 11,7). Sağlamlık:
    aykırılar hariç (n = 56) F0 = −658 mn (p = 0,085); yalnız genel (n = 47) F0 = +233 mn (p = 0,51), v = 12,31 mn;
    başlama 2025–2026 (n = 7) F0 = −575 mn; başlama ≤2024 (n = 54) F0 = −106 mn; formül satırları hariç (n = 50)
    F0 = −230 mn; üniversiteler dahil (n = 75) F0 = −74 mn; ek binalar dahil (n = 70) F0 = −135 mn — hepsi p > 0,05.
    Dışlananlar ve gerekçeleri: data/reference/yatirim_programi_2026_saglik.csv (dislama_nedeni sütunu; ek bina/
    yenileme 12, paket proje 8, etüd-proje aşaması 6, toplu/çok yerli 3, kurum dışı 3, pandemi/acil durum 2, birden
    çok tesis 1, yalnız etüt bedeli 2; KÖİ 'Şehir Hastanesi Kullanım Bedeli' satırında yatak yok).
    v'NİN MAKULLÜĞÜ: tebliğe göre yatak başı inşaat 130 m² × 40.500–48.750 TL/m² = 5,27–6,34 mn TL (KDV, altyapı,
    donanım hariç); programdaki v bunun 2,3–2,8 katı. Fark açıklanabiliyor: programdaki projelerde alan ≈ 257,5
    m²/yatak (eğim; medyan 250, aralık 171–380), yani 130 m² asgarisinin ≈2 katı; birim maliyet eğimi 56.604 TL/m²
    KDV dahil (tebliğ 40.500–53.500 TL/m² KDV hariç aralığıyla KDV eklenince uyumlu). v makul, F0 makul değil
    (negatif ve anlamsız).
    A0 İLE ETKİLEŞİM (çift sayımı önleme): modelde Fixed_jk = (1+kdv)·(1+φ_alt+φ_don)·u_k·A0 + p_j·L0 + F_sabit.
    Regresyon kesişimi F0, KDV dahil proje tutarı cinsinden yataktan bağımsız TÜM kısmı (çekirdek alan inşaatı
    dahil) temsil eder; bu nedenle veriyle tutarlılık için (1+kdv)·(1+φ)·u_k·A0 + F_sabit toplamı F0'ın %95 GA üst
    sınırını (≈0,74–0,94 milyar TL) aşmamalı. F_sabit yalnız alana bağlı olmayan kalemler içindir (etüt-proje,
    bağlantı yolu/kavşak, altyapı bağlantıları, ruhsat vb.); bunları A0 inşaatına ya da φ_alt oranına ikinci kez
    eklemeyin. F_sabit KDV dahil kabul edilir (KYP tutarları KDV dahil — yatirim_rehber_2026_2028 md. 19); modelde
    F_sabit'e ayrıca (1+kdv) uygulanmamalı. Kaynaklı örnekler: KYP'de kavşak/bağlantı yolu 5,69 milyar TL / 4 il
    (≈1,42 milyar TL/il; satırda hastane sayısı yazmıyor, il başına bir hastane varsayımıyla) — büyük şehir
    hastaneleri için üst uç; üniversite hastanelerinin etüt-proje satırları 20 mn TL (250 yatak, 50.000 m²) ile
    48–60 mn TL (800 yatak, 120.000 m²) arasında — alana bağlı, küçük. Kaydırıcı aralığı [0; 1,5 milyar TL] bu iki
    uç arasını kapsar; sunumda duyarlılık (tornado) analizinde mutlaka gösterilmeli.
