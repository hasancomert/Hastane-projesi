    müracaatları ve danışmanlık başvuruları hariç (SİY 2024 Bölüm 8 açıklamaları, PDF s. 237). Ziyaret sayısıdır,
    tekil hasta sayısı değildir. Aralık (8–18) varsayımdır.

- key: access.share_hospital_visits
  label: "Müracaatlarda ikinci + üçüncü basamak payı"
  value: 0.587
  unit: "oran (0–1)"
  status: kaynakli
  source_ids: [saglik_sbsgm_bulten2025]
  range: [0.4, 0.8]
  alternatives:
    - {label: "Türkiye 2024: %56,7 (Haber Bülteni 2024 PDF s. 9 metni; şartname Bölüm 3)", value: 0.567, status: kaynakli, source_ids: [saglik_sbsgm_bulten2024]}
    - {label: "Türkiye 2023: %56,7 (Haber Bülteni 2023 PDF s. 8 metni)", value: 0.567, status: kaynakli, source_ids: [saglik_sbsgm_bulten2023]}
    - {label: "2025, yalnız hastaneler (özel tıp merkezleri hariç): 656.167.336 / 1.138.060.185", value: 0.5766, status: hesap, source_ids: [saglik_sbsgm_bulten2025]}
    - {label: "Ankara 2024: 47.073.855 / (47.073.855 + 28.920.274) (SİY 2024 Tablo 8.26)", value: 0.6194, status: hesap, source_ids: [saglik_sbsgm_siy2024]}
    - {label: "Ankara 2023: 44.014.412 / (44.014.412 + 27.961.355) (SİY 2023 Tablo 8.25)", value: 0.6115, status: hesap, source_ids: [saglik_sbsgm_siy2023]}
  notes: >-
    SİY 2025 Haber Bülteni, PDF s. 9 metni: 'hekime müracaatın %41,3'ü birinci basamak ... %58,7'si ikinci ve üçüncü
    basamak sağlık kurumlarına yapıldı'. TANIM UYARISI: 'ikinci ve üçüncü basamak' hastanelere ek olarak özel tıp
    merkezlerini de (2025: 11.536.197 müracaat, toplamın %1,0'ı) içerir; yalnız hastaneler %57,66. Aralık varsayımdır.

- key: access.hospital_visits_per_capita
  label: "Kişi başı yıllık hastane başvurusu (v)"
  value: 7.75
  unit: "başvuru / kişi / yıl"
  status: hesap
  source_ids: [saglik_sbsgm_bulten2025]
  derivation: "access.visits_per_capita_total × access.share_hospital_visits = 13,2 × 0,587 = 7,748 ≈ 7,75 (SİY 2025 Haber Bülteni Tablo 15 ve PDF s. 9 metni)"
  range: [4.0, 10.0]
  alternatives:
    - {label: "2025, yayımlanan ikinci + üçüncü basamak kişi başı müracaat (Tablo 15)", value: 7.8, status: kaynakli, source_ids: [saglik_sbsgm_bulten2025]}
    - {label: "2025, yalnız hastanelerde kişi başı müracaat (Tablo 11 ve 15; özel tıp merkezleri hariç)", value: 7.6, status: kaynakli, source_ids: [saglik_sbsgm_bulten2025]}
    - {label: "2024: 12,2 × 0,567 — şartname Bölüm 3 / 4.4 G değeri (≈6,9)", value: 6.92, status: hesap, source_ids: [saglik_sbsgm_bulten2024]}
    - {label: "2024, yalnız hastanelerde kişi başı müracaat (Haber Bülteni 2024 Tablo 12 ve 16; SİY 2024 Tablo 8.2)", value: 6.8, status: kaynakli, source_ids: [saglik_sbsgm_bulten2024, saglik_sbsgm_siy2024]}
    - {label: "2023: 11,4 × 0,567", value: 6.46, status: hesap, source_ids: [saglik_sbsgm_bulten2023]}
    - {label: "Ankara 2024: 47.073.855 / 5.864.049 (SİY 2024 Tablo 8.26 ve 1.3)", value: 8.03, status: hesap, source_ids: [saglik_sbsgm_siy2024]}
  notes: >-
    Şartnamenin yöntemi (kişi başı müracaat × ikinci+üçüncü basamak payı) 2025 verisine uygulandı; çarpım yayımlanan
    7,8 ile tutarlı (667.703.533 / 86.092.168 = 7,76). Hastane dışı özel tıp merkezlerini dışlamak için 7,6 seçilebilir.
    Ankara değeri il dışından gelen başvuruları da içerir (yorum). Aralık (4–10) varsayımdır.
