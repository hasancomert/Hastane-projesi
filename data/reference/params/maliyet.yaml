    - {label: "Şehir hastaneleri (Aliefendioğlu & Bostancı 2021, yazıldığı gibi)", value: 331, status: kaynakli, source_ids: [maliyet_aliefendioglu_2021]}
    - {label: "Bilkent (1.312.358 ÷ 3.810) — aynı kampüs; hastane dışı alanlar büyük olasılıkla dahil, yüksek gösterir", value: 344.5, status: hesap, source_ids: [maliyet_medikalakademi_bilkent, maliyet_kalkinma_ankara_2017]}
    - {label: "2026 KYP genel bütçeli şehir hastaneleri, medyan (n = 14)", value: 279.5, status: hesap, source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]}
    - {label: "2026 KYP genel bütçeli şehir hastaneleri, proje başına ortalama (n = 14)", value: 284.4, status: hesap, source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]}
