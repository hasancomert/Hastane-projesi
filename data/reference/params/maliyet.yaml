# ---------------------------------------------------------------- C. Yatak başına alan ve çekirdek alan

- key: cost.m2_per_bed.general
  label: "Yatak başına kapalı alan — genel hastane"
  value: 228.35
  unit: "m² kapalı alan / yatak"
  status: hesap
  source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]
  derivation: >-
    2026 Yatırım Programı'ndaki 47 Sağlık Bakanlığı genel hastane projesinde kapalı alan = A0 + a·yatak (OLS):
    a = 228,35 m²/yatak (%95 GA 197,4–259,3; R² = 0,83), A0 = 3.361 m² (cost.core_area_m2 ile birlikte kullanılır).
    Hesap: pipeline/18_costs.py → data/processed/kyp_alan_yatak.json (ols_alan_yatak.genel).
  rationale: >-
    Öğrenci kararı (2026-10-21, docs/KARARLAR.md #5): iki hastane sınıfı aynı tabanda, Bakanlığın gerçekleşen
    projelerinden ölçülür. Spec'teki 130 m²/yatak resmî düzenlemede asgari arsa (imar) standardıdır; alternatif olarak kalır.
  range: [100, 350]
  alternatives:
    - {label: "Asgari standart 130 m²/yatak (spec varsayılanı; Balcalı 2019 ve EHTA 2021'in aktardığı 2010 Kılavuzu; MPYY EK-2'de arsa standardı)", value: 130, status: kaynakli, source_ids: [maliyet_balcali_2019, maliyet_ehta_2021]}
    - {label: "SB mevcut hastane stoku (19 mn m² ÷ 137.000 yatak)", value: 138.7, status: hesap, source_ids: [maliyet_aliefendioglu_2021]}
    - {label: "Balcalı Hastanesi (190.651 ÷ 1.200; makalede 158,87)", value: 158.9, status: kaynakli, source_ids: [maliyet_balcali_2019]}
    - {label: "2026 KYP SB genel hastaneleri, ≤600 yatak OLS eğimi (n = 44; A0 = 7.695 m² ile birlikte)", value: 214.13, status: hesap, source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]}
    - {label: "2026 KYP SB genel hastaneleri, toplam/toplam (n = 47) — gerçekleşen proje alanı", value: 237.0, status: hesap, source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]}
    - {label: "2026 KYP SB genel hastaneleri, medyan (n = 47) — gerçekleşen proje alanı", value: 250.0, status: hesap, source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]}
  notes: >-
    Önceki varsayılan (spec, 130) alternatiflerde. Aşağıdaki not Faz 1 incelemesidir. Balcalı makalesi 2010 Kılavuzu'ndan 'İhtisas hastaneleri asgari
    alan büyüklüğü yatak sayısı ile 130 m²'nin çarpımı' (s. 211), EHTA 2021 'hastane binasının toplam inşaat alanı baz
    alınarak yatak başına 130 m2 şartı' (s. 15). ÇELİŞKİ / UYARI: (1) Kılavuzun kendisi indirilemedi (vekil 403). (2) Resmî
    Mekânsal Planlar Yapım Yönetmeliği EK-2'de aynı 130 m²/yatak, imar planında ayrılacak SAĞLIK TESİSİ ALANI (arsa)
    standardıdır (maliyet_mpyy_ek2); EHTA da 130'u 'İmar Kanunu, Plan Yapımına Ait Esaslara Dair Yönetmelik' hükmü olarak
    anıyor. Yani 130'un bina alanı olarak kullanımı akademik yorumdur. (3) 130 bir ASGARİdir; Bakanlığın 2026 KYP'deki yeni
    genel hastane projeleri ≈250 m²/yatak (medyan; 47 projenin 19'unda tam 200 ya da 250), yani ≈1,9 katı. Sınıflara göre
    toplam/toplam: <200 yatak 266,1 · 200–399: 243,5 · ≥400: 233,2. 130 ile hesaplanan inşaat maliyeti yeni projelerin
    yaklaşık yarısıdır (bkz. cost.core_area_m2 notu). Öğrenci kararı gerekli.
    TEMEL FARKI: varsayılan 130 bir ASGARİ / imar standardıdır (plan ve tasarım alt sınırı); KYP alternatifleri ise
    Bakanlığın yatırım programındaki gerçek projelerin karakteristiğinde yazan kapalı alandır (gerçekleşen proje alanı,
    asgari değil). İkisi aynı büyüklüğü ölçmez: KYP eğimi (228,35) yalnız KYP kesişimiyle (A0 = 3.361 m²) birlikte,
    ≤600 yatak eğimi (214,13) A0 = 7.695 m² ile birlikte anlamlıdır. Tüm KYP sayıları pipeline/18_costs.py ile
    data/processed/kyp_alan_yatak.json'a yazılır. Varsayılan değiştirilmedi.

