- key: cost.core_area_m2
  label: "Yataktan bağımsız çekirdek alan (A0)"
  value: 3361
  unit: "m² kapalı alan / hastane"
  status: hesap
  source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026]
  derivation: >-
    2026 Yatırım Programı'ndaki 47 SB genel hastane projesinde kapalı alan = A0 + a·yatak regresyonunun kesişimi:
    A0 = 3.361 m² (a = 228,35 ile birlikte). İstatistiksel olarak sıfırdan ayırt edilemiyor (%95 GA −9.818…16.540;
    p = 0,61); bu yüzden duyarlılık analizinde 0–16.540 aralığında gösterilir.
  rationale: >-
    Öğrenci kararı (2026-10-21, docs/KARARLAR.md #5): a ile aynı regresyondan, tutarlı çift olarak alınır. Önceki
    varsayılan 5.000 m² (varsayım) alternatiflerde. Faz 1 gerekçe notu: veriden anlamlı biçimde tanımlanamadı. Dayanaklar (hepsi 2026 KYP SB
    genel hastaneleri): alan = A0 + a·yatak regresyonu n = 47 için A0 = 3.361 m² (%95 GA −9.818…16.540; p = 0,61),
    ≤600 yatak (n = 44) için 7.695 m² (p = 0,12); sınıf ortalamalarından iki nokta tahmini 6.938 m². Yatak başı alanın
    büyüklükle düşmesi (266 → 244 → 233 m²/yatak) küçük ama pozitif bir sabit çekirdek alanla tutarlı. Üst sınır kontrolü:
    yatirim alanının F0 %95 GA üst sınırı (0,74–0,94 milyar TL) − F_sabit (250 mn TL) payı, (1,20)(1,40)·u_k ile bölününce
    ≈6.700–10.200 m² eder; 5.000 bunun altında. Balcalı'da tüm teknik ve destek birimleri 27.326 m² (1.200 yatak,
    %14,3) ama mutfak, çamaşırhane, depo gibi kalemler yatakla ölçeklendiği için A0 olarak alınmadı.
  range: [0, 45000]
  alternatives:
    - {label: "Önceki varsayılan: tahminlerin ortasında yuvarlak değer (varsayım)", value: 5000, status: varsayim, source_ids: [maliyet_hesap_kyp_alan]}
    - {label: "Çekirdek alan yok", value: 0, status: model_secimi, source_ids: []}
    - {label: "KYP sınıf ortalamaları, iki nokta (a = 219,9 ile)", value: 6938, source_ids: [maliyet_hesap_kyp_alan]}
    - {label: "KYP regresyon kesişimi, ≤600 yatak (a = 214,1 ile)", value: 7695, source_ids: [maliyet_hesap_kyp_alan]}
    - {label: "a = 130 sabitken KYP ortalamasını tutturan A0 (önerilmez)", value: 41552, source_ids: [maliyet_hesap_kyp_alan]}
  notes: >-
    A0 ile cost.m2_per_bed.general birlikte seçilmeli. a = 130 ve A0 = 5.000 ile 150 yataklı hastane 24.500 m², 600
    yataklı 83.000 m² çıkar; KYP'de aynı boyutlar 26.432–49.250 m² ve 104.000–152.000 m²'dir. KYP ile tutarlı çift
    (a ≈ 228, A0 ≈ 3.400) ya da (a ≈ 214, A0 ≈ 7.700) kullanılabilir. a = 130'u koruyup A0 = 41.552 almak alanı tutturur
    ama ölçek ekonomisini abartır (küçük hastaneyi çok pahalı yapar). Duyarlılık analizinde mutlaka gösterilmeli (spec 4.2).

# ---------------------------------------------------------------- C. Tebliğe dahil olmayan kalemler ve KDV

- key: cost.infra_ratio
  label: "Altyapı + çevre düzenlemesi oranı (φ_alt)"
  value: 0.15
  unit: "inşaat maliyetine oran"
  status: varsayim
  source_ids: [yatirim_rehber_2026_2028, maliyet_rg_2026_birim_maliyet_teblig]
  rationale: >-
    Hastaneye özgü bir altyapı + çevre düzenlemesi oranı bulunamadı. %15, SBB 2026-2028 Yatırım Programı Hazırlama
    Rehberi EK 3'teki İDARİ HİZMET BİNASI gerekçe raporu şablonundan (PDF s. 51: 'd) Çevre Düzenlemesi (%15) c x %15')
    BENZETMEYLE alındı: şablon hastaneler için değildir ve yalnız 'çevre düzenlemesi'ni adlandırır; tebliğ md. 2(4)'ün
    ayrıca hariç tuttuğu altyapıyı (zemin iyileştirme, bina dışı şebekeler) açıkça kapsamaz. Kaynakta yazan bir hastane
    oranı olmadığı için değer varsayımdır; alt uca yakın, temkinli bir seçimdir ve duyarlılık analizinde aralık
    [0,05; 0,30] taranmalıdır.
  range: [0.05, 0.30]
  notes: >-
    SBB 2026-2028 Yatırım Programı Hazırlama Rehberi, EK 3 (İdari Hizmet Binası Gerekçe Raporu), 'Ödenek Talebine Esas
    Bedel Hesabı' (PDF s. 51, basılı s. 44): 'c) İnşaat Maliyeti a x b; d) Çevre Düzenlemesi (%15) c x %15; e) Toplam c + d;
    f) KDV … e x %…'; a = tebliğdeki birim maliyet. Bu şablon idari hizmet binaları içindir; hastaneye özgü bir oran
    bulunamadı. Tebliğ md. 2(4) hem çevre düzenlemesini hem altyapıyı (zemin iyileştirme, bina dışı şebekeler) hariç
    tutar; şablondaki %15 yalnız 'çevre düzenlemesi' diye adlandırılmıştır, bu yüzden 0,15 alt uca yakın bir değerdir.
    Bağlantı yolu/kavşak ve altyapı bağlantıları yatirim alanında F_sabit içinde düşünüldü — çift sayılmamalı.

- key: cost.equipment_ratio
  label: "Tıbbi donanım oranı (φ_don)"
  value: 0.25
  unit: "inşaat maliyetine oran"
  status: varsayim
  source_ids: [maliyet_hesap_kyp_alan, yatirim_kyp2026, maliyet_savas_2020]
  rationale: >-
    Resmî ya da hakemli bir Türkiye oranı bulunamadı. 2026 KYP'de inşaat ve makine-teçhizatı ayrı alt proje olarak
    gösteren yataklı iki hastane var: KTÜ Çocuk Hastanesi (225 yatak) 0,158 ve Gaziantep Ü. Acil Travma ve Yanık Hastanesi
    (134 yatak) 0,320; ortalaması 0,239 → 0,25 yuvarlandı. Diş hastanelerinde oran 0,16–0,46. Diğer satırlardaki 2.000–
    10.000.000 TL'lik makine-teçhizat kalemleri yer tutucudur (donanım sonradan bütçeleniyor), oran hesabına alınmadı.
    Şehir hastaneleri için ≈4 milyar TL tıbbi cihaz + mefruşat yatırımı bildiriliyor (Savaş vd. 2020) ama toplam yatırım
    farklı para birimi/yıllarda verildiğinden oran çıkarılamadı.
  range: [0.10, 0.45]
  alternatives:
    - {label: "KTÜ Çocuk Hastanesi, 225 yatak (KYP 2014I00-2082)", value: 0.158, source_ids: [maliyet_hesap_kyp_alan]}
    - {label: "Gaziantep Ü. Acil Travma ve Yanık H., 134 yatak (KYP 2022I00-183763)", value: 0.320, source_ids: [maliyet_hesap_kyp_alan]}
  notes: >-
    KYP'deki SB genel hastane proje tutarları m² başına 54.461 TL (KDV dahil, toplam/toplam), yani tebliğ fiyatı + KDV
    düzeyinde; KYP tutarları donanımı büyük ölçüde içermiyor gibi görünüyor. φ_don'un yatirim alanının v (TL/yatak)
    tahminiyle çift sayılmaması için model hangi tutarın neyi içerdiğini açıklamalı.

- key: cost.vat_rate
  label: "KDV oranı (genel)"
  value: 0.20
  unit: "oran"
  status: kaynakli
  source_ids: [maliyet_rg_2023_kdv_karar_7346]
  range: [0.0, 0.20]
  alternatives:
    - {label: "10.07.2023 öncesi genel oran", value: 0.18, source_ids: [maliyet_rg_2023_kdv_karar_7346]}
  notes: >-
    Cumhurbaşkanı Kararı 7346 (RG 07.07.2023/32241) md. 1: 2007/13033 sayılı BKK md. 1(1)(a)'daki '%18' ibaresi '%20'
    olarak değiştirildi; yürürlük 10.07.2023. (I) ve (II) sayılı listelerdeki teslimler %1 ve %10'dur; tıbbi donanımın
    indirimli listede olup olmadığı bu çalışmada incelenmedi (model tek oran kullanır). SBB rehber şablonundaki '%18' eski
    değerdir. GİB'in güncel oran tablosu indirilemedi (vekil 403); 7346'dan sonra genel oranı değiştiren karar bulunamadı.
    Aralığın alt ucu 0: KDV'yi hariç tutmak (cost.include_vat = false) ile aynı etki.

- key: cost.include_vat
  label: "Maliyetlere KDV dahil mi?"
  value: true
  unit: "evet/hayır"
  status: model_secimi
  source_ids: [yatirim_rehber_2026_2028, maliyet_rg_2026_birim_maliyet_teblig]
  rationale: >-
    Varsayılan 'dahil': model kamu bütçesinin ödeyeceği tutarı hesaplar ve devlet yüklenici faturasındaki KDV'yi öder.
    Ayrıca kamu yatırım tutarları KDV dahil hazırlanır (SBB rehberi md. 19; EK 3 not 2 'Proje Toplam Maliyetine KDV
    dahildir') ve yatirim alanının F_sabit değeri KDV dahildir — tutarlılık için tebliğin KDV hariç fiyatlarına KDV
    eklenir. Alternatif 'hariç': toplumsal maliyet bakışında KDV hazineye dönen bir transferdir; o zaman F_sabit de
    KDV'siz yorumlanmalıdır.

# ---------------------------------------------------------------- D. Arsa alanı (fiyat parametreleri başka alanda)

- key: land.m2_per_bed
  label: "Yatak başına arsa (plan alanı)"
  value: 130
  unit: "m² arsa / yatak"
  status: kaynakli
  source_ids: [maliyet_mpyy_ek2]
  range: [50, 300]
  alternatives:
    - {label: "Sağlık kampüsleri (şehir hastanesi) standardı", value: 220, source_ids: [maliyet_mpyy_ek2]}
    - {label: "Balcalı (95.000 m² açık alan ÷ 1.200)", value: 79.2, source_ids: [maliyet_balcali_2019]}
    - {label: "Bilkent (674.000 m² arazi ÷ 3.810)", value: 176.9, source_ids: [maliyet_medikalakademi_bilkent]}
    - {label: "Dikili (15.010 m² açık alan ÷ 75)", value: 200.1, source_ids: [maliyet_cnnturk_dikili_2026]}
  notes: >-
    Mekânsal Planlar Yapım Yönetmeliği EK-2: Devlet hastaneleri, İhtisas/Eğitim ve Araştırma hastaneleri, FTR
    hastaneleri ve Doğum ve Çocuk Bakım Evleri için asgari birim alan 'Yatak başına (130) m²', 'Sağlık Kampüsleri' için
    'Yatak başına (220) m²'. Model sınıf bazında ayırabiliyorsa şehir hastanesi sınıfı için 220 kullanılmalı. Bu bir
    asgari plan standardıdır; ilçe imar planı yoğunluğuna göre gerçek parseller farklıdır (Balcalı eski, Bilkent/Dikili
    standardın üstünde).

- key: land.min_parcel_m2
  label: "Asgari parsel"
  value: 6500
  unit: "m² arsa / hastane"
  status: hesap
  source_ids: [maliyet_mpyy_ek2]
  derivation: "land.m2_per_bed × size.general_min_beds = 130 m²/yatak × 50 yatak = 6.500 m²"
  range: [0, 20000]
  alternatives:
    - {label: "Doğrusal maliyet formülünde L0 (çift sayımı önlemek için)", value: 0, source_ids: [maliyet_mpyy_ek2]}
    - {label: "EK-2 'Basamak Sağlık Tesisleri' asgari birim alanı (hastane değil)", value: 3000, source_ids: [maliyet_mpyy_ek2]}
  notes: >-
    EK-2'de hastaneler için ayrı bir asgari parsel yok; standart yatakla orantılı. 6.500 m², en küçük izinli genel
    hastanenin (50 yatak) parselidir: arsa alanı = max(land.min_parcel_m2, land.m2_per_bed × B) biçiminde alt sınır
    olarak kullanılmalı; B ≥ 50 için bağlayıcı değildir. Spec 4.5'teki doğrusal Fixed_jk formülündeki L0 terimi
    olarak kullanılacaksa 0 alınmalı (yoksa ℓ·B ile çift sayılır).
