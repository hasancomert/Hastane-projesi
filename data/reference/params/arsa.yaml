# Alan: erisim — D. Arsa fiyatı parametreleri (spec 4.4 D). Arsa alanı (land.m2_per_bed, land.min_parcel_m2) maliyet alanında.
# Model: p_j = land.price_base_tl_m2 · (yoğunluk_j / medyan yoğunluk)^land.price_beta   [TL/m², aday hücre j]
#   yoğunluk_j: hücre nüfusu / hücre alanı (kişi/km²); medyan: aday hücreler (J) üzerinden.
# Kaynaklar: data/sources/erisim.yaml ; ayrıntı: data/reference/erisim_turetim.md

- key: land.include
  label: "Arsa maliyeti dahil mi?"
  value: false
  unit: "evet/hayır"
  status: varsayim
  source_ids: [erisim_mevzuat_6428, yatirim_rehber_2026_2028]
  rationale: >-
    Varsayılan: kamu arazisi → arsa bedeli 0. Kamu hastaneleri çoğunlukla Hazine taşınmazı üzerinde yapılır (ör. 6428
    sayılı Kanun md. 1: KÖİ tesisleri 'Hazinenin özel mülkiyetindeki taşınmazlar üzerinde … üst hakkı tesis edilmek
    suretiyle' yaptırılır). SBB 2026-2028 Yatırım Programı Hazırlama Rehberi Ek-1 ekonomik analiz açıklaması (PDF s. 43):
    'Transferler (kamulaştırma, arazi bedeli, vergi, teşvik gibi) ekonomik analizde dikkate alınmaz.' Arazinin alternatif
    kullanım değeri (fırsat maliyeti) ise sıfır değildir; bu yüzden anahtar açılınca aşağıdaki vekil fiyat modeli kullanılır.

- key: land.price_base_tl_m2
  label: "Arsa birim fiyatı — medyan yoğunluklu aday hücrede"
  value: 2000
  unit: "TL / m² (2026)"
  status: varsayim
  source_ids: [erisim_haber_yeniankara_evren_arsa_2026, erisim_haber_yeniankara_toki_arsa_2026, erisim_rg_emlak_vergisi_teblig_89]
  rationale: >-
    Ankara için ilçe/hücre düzeyinde güvenilir, açık ve resmî bir arsa fiyatı veri seti bulunamadı (emlak vergisi asgari
    m² birim değerleri sokak bazında ve yalnız yerel ilanla yayımlanıyor; TKGM, TOKİ ve belediye siteleri bu ortamdan
    erişilemedi). 3 km aday hücrelerinin (P_min = 250) medyan yoğunluğu ≈85 kişi/km² (kalibre edilmemiş GHS-POP 2025 ön
    hesabı) — kırsal kasaba çevresi. Bu düzey için haber kaynaklı tek nokta: Evren'de konut imarlı arsa ortalaması 1.379
    TL/m², tarla 100–300 TL/m² (Mayıs 2026). Yuvarlak 2.000 TL/m² seçildi. Kaba tutarlılık (kalibrasyon değil): β = 0,5 ile
    90. yüzdelik yoğunluktaki (≈2.700 kişi/km²) hücrede ≈11.200 TL/m² (TOKİ Sincan Yeni Peçenek muhammen ≈9.400–12.900),
    en yoğun hücrede (≈33.000 kişi/km²) ≈39.400 TL/m² (TOKİ Gölbaşı İncek ≈38.500, Yenimahalle Susuz kentsel servis alanı
    ≈31.000 TL/m²; Eylül 2026).
  range: [0, 40000]
  alternatives:
    - {label: "Evren konut imarlı arsa ortalaması (haber, Mayıs 2026)", value: 1379, status: kaynakli, source_ids: [erisim_haber_yeniankara_evren_arsa_2026]}
    - {label: "TOKİ Sincan Temelli/Alcı muhammen bedel (≈5.000 m², >30 mn TL; kaba)", value: 6000, status: hesap, source_ids: [erisim_haber_yeniankara_toki_arsa_2026]}
    - {label: "TOKİ Yenimahalle Susuz kentsel servis alanı (140,7 mn TL / 4.538,61 m²)", value: 31001, status: hesap, source_ids: [erisim_haber_yeniankara_toki_arsa_2026]}
  notes: >-
    Arsa birim fiyatı yalnız land.include = true iken kullanılır. Hastane parselleri (kentsel servis alanı) genellikle
    konut arsasından farklı fiyatlanır; TOKİ muhammen bedeli satış fiyatı değildir. Faz 2'de (ızgara hazır olunca)
    medyan yoğunluk gerçek aday kümesiyle yeniden hesaplanmalı.

- key: land.price_beta
  label: "Arsa fiyatının nüfus yoğunluğu esnekliği (β)"
  value: 0.5
  unit: "boyutsuz"
  status: varsayim
  rationale: >-
    Kaynaklı bir esneklik bulunamadı. β = 0,5 ile yoğunluk 100 kat artınca fiyat 10 kat artar; ön hesapta aday hücre
    yoğunlukları ≈33 (10. yüzdelik) ile ≈33.000 kişi/km² (en yoğun) arasında, bu da medyana göre ≈0,6× ile ≈19,7× fiyat
    aralığı verir — TOKİ'nin Eylül 2026 Ankara muhammen bedellerinin (≈6.000 – 38.500 TL/m²) ve Evren kırsal arsa
    fiyatının (1.379 TL/m²) kapsadığı yelpazeyle kabaca uyumlu. β = 0 tüm hücrelerde aynı fiyat demektir.
  range: [0.0, 1.5]
  alternatives:
    - {label: "Sabit fiyat (yoğunluktan bağımsız)", value: 0.0, status: model_secimi}
    - {label: "Zayıf bağımlılık (en yoğun/medyan ≈ 6×)", value: 0.3, status: varsayim}
    - {label: "Güçlü bağımlılık (en yoğun/medyan ≈ 65×)", value: 0.7, status: varsayim}
