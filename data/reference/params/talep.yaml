- key: demand.hb.target_occupancy
  label: "Hedef yatak doluluk oranı (planlama)"
  value: 0.85
  unit: "oran (0–1)"
  status: model_secimi
  source_ids: [saglik_aydemir2019, saglik_cirakli2019]
  rationale: >-
    Kaynaklar tek bir planlama hedefi vermiyor, genel hastaneler için 'olumlu' kabul edilen %80–85 ARALIĞINI veriyor;
    üstelik bu aralık ikinci el: Aydemir (2019) Ağırbaş (2016), Çıraklı (2019) Ağırbaş (2012) ders kitabından aktarıyor
    (kitap okunmadı); %85 'kabul görmüş standart' ifadesi de Bagust vd. (1999) için yalnız Aydemir üzerinden aktarılıyor
    (tam metin okunamadı). 0,85 bu aralığın üst ucu olarak seçildi: aynı talep için en az yatağı veren (yatakların
    verimli kullanımı) ama Bagust vd.'nin %85 eşiğini (aşılınca erişim engeli, uzun bekleme, yüksek mortalite) aşmayan
    değer.
    Aralığın alt ucu (0,80) ve diğer değerler alternatif olarak duruyor; kaydırıcıyla duyarlılık analizi yapılabilir.
  range: [0.5, 0.95]
  alternatives:
    - {label: "Genel hastaneler için kabul edilen aralığın alt ucu (%80; Aydemir 2019, Çıraklı 2019)", value: 0.80, status: kaynakli, source_ids: [saglik_aydemir2019, saglik_cirakli2019]}
    - {label: "SB eğitim-araştırma hastanelerinde verimlilik göstergesi %72 (Aydemir 2019, Ağırbaş 2016'ya atıfla)", value: 0.72, status: kaynakli, source_ids: [saglik_aydemir2019]}
    - {label: "Türkiye'nin 2025 gerçekleşen doluluğu (%54,5; mevcut yatak/nüfus oranını yeniden üretir)", value: 0.545, status: kaynakli, source_ids: [saglik_sbsgm_bulten2025]}
  notes: >-
    Aydemir (2019, USAYSAD 5(2), dergi s. 233 / PDF s. 4): 'Yatak doluluk oranının genel hastanelerde %80-85 ... olması
    olumlu olarak değerlendirilir'; aynı sayfada Bagust vd. (1999, BMJ 319:155–8) için 'kabul görmüş standart (%85)'
    aşıldığında erişim engeli, uzun bekleme ve yüksek mortalite, %80'in altında ise tesislerin boşta kaldığı aktarılıyor.
    Çıraklı (2019, s. 43) aynı %80–85 aralığını teyit ediyor. Bagust vd. tam metni okunamadı (bmj.com/PMC vekil
    sunucuda engelli); künyesi Crossref ile doğrulandı. Sağlık Bakanlığı stratejik planı/hedef gösterge belgeleri
    (sgb.saglik.gov.tr, khgm.saglik.gov.tr, khgmickontrol.saglik.gov.tr) vekil sunucuda 403 verdiği için okunamadı.
    ÖNEMLİ: 2025'te gerçekleşen doluluk %54,5 olduğundan Hill-Burton (%85) oran yöntemine göre ≈%36 daha az yatak verir.
    Aralık (0,50–0,95) varsayımdır.

