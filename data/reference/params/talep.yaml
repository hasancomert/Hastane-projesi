- key: demand.hb.target_occupancy
  label: "Hedef yatak doluluk oranı (planlama)"
  value: 0.85
  unit: "oran (0–1)"
  status: model_secimi
  source_ids: [saglik_bagust1999, alan_literatur_lit_ravaghi2020, saglik_aydemir2019, saglik_cirakli2019]
  rationale: >-
    Kaynaklar tek bir planlama hedefi vermiyor, büyük/genel hastaneler için %80–85 ARALIĞINI veriyor: Ravaghi vd. (2020,
    sistematik tarama; tam metin okundu) 'the target bed occupancy rate is usually considered to be 80–85% of the total
    bed capacity for large hospitals, and 45% for small hospitals'; Aydemir (2019) ve Çıraklı (2019) aynı aralığı
    Ağırbaş'ın ders kitabından aktarıyor (kitap okunmadı). 0,85 bu aralığın üst ucu olarak seçildi: aynı talep için en
    az yatağı veren (yatakların verimli kullanımı) ama Bagust vd. (1999; tam metin okundu) simülasyonunda risklerin
    belirdiği eşiği aşmayan değer ('Risks are discernible when average bed occupancy rates exceed about 85%'; %90 ve
    üstünde düzenli yatak krizi). Sağlık Bakanlığı'nın resmî bir doluluk hedefi bulunamadı (Stratejik Plan 2024–2028,
    2026 Performans Programı ve KHGM GÖREN 2026 göstergelerinde doluluk yok), bu yüzden değer model seçimidir.
    Aralığın alt ucu (0,80) ve diğer değerler alternatif olarak duruyor; kaydırıcıyla duyarlılık analizi yapılabilir.
  range: [0.5, 0.95]
  alternatives:
    - {label: "Büyük/genel hastaneler için kabul edilen aralığın alt ucu (%80; Ravaghi 2020, Aydemir 2019, Çıraklı 2019)", value: 0.80, status: kaynakli, source_ids: [alan_literatur_lit_ravaghi2020, saglik_aydemir2019, saglik_cirakli2019]}
    - {label: "SB eğitim-araştırma hastanelerinde verimlilik göstergesi %72 (Aydemir 2019, Ağırbaş 2016'ya atıfla)", value: 0.72, status: kaynakli, source_ids: [saglik_aydemir2019]}
    - {label: "Türkiye'nin 2025 gerçekleşen doluluğu (%54,5; mevcut yatak/nüfus oranını yeniden üretir)", value: 0.545, status: kaynakli, source_ids: [saglik_sbsgm_bulten2025]}
  notes: >-
    Bagust vd. (1999, BMJ 319:155–8; PMC28163) özet, Results: 'Risks are discernible when average bed occupancy rates
    exceed about 85%, and an acute hospital can expect regular bed shortages and periodic bed crises if average bed
    occupancy rises to 90% or more.' Gövde, Results: 'Risks are minimal so long as the mean bed occupancy remains below
    about 85%. Above this level the risks become substantial (at 85%, a hospital can expect to be short of beds for
    admissions on four days in a year) ...'. Makale %85'i 'standart' ya da 'hedef' diye adlandırmıyor ve mortaliteden söz
    etmiyor: Aydemir'in (2019, USAYSAD 5(2), dergi s. 233 / PDF s. 4) 'kabul görmüş standart (%85) ... yüksek mortalite'
    aktarımı aslından güçlü. Ravaghi vd. (2020, BMC HSR 20:186; PMC7060560) Table 4 'Formula method': 'Based on target
    occupancy rates (80–85% for large hospitals and 45% for small hospitals)'; yöntem yatak ihtiyacını (ort. kalış ×
    yatış oranı × nüfus) / (dönem süresi × hedef doluluk) olarak hesaplıyor. Aynı formül 'Hill-Burton formula' adıyla
    Nates vd. (2023, Crit Care Med 51:1552–65; PMC11192408) Table 2'de: yıllık yatış × ort. kalış / (365 × ideal doluluk)
    (alan_literatur_lit_nates2023). Çıraklı (2019, s. 43) ve Aydemir (2019) %80–85'i 'olumlu' aralık olarak veriyor.
    Resmî hedef aranan belgeler: Sağlık Bakanlığı 2024–2028 Stratejik Planı (saglik_sb_stratejik_plan_2024_2028), 2026
    Performans Programı (saglik_sb_performans_programi_2026), KHGM GÖREN 2026 kılavuzu (saglik_khgm_goren_kilavuz_2026):
    hiçbirinde doluluk hedefi/göstergesi YOK. Plan yalnız '10.000 kişiye düşen hastane yatağı' için 2028 hedefi 38 veriyor
    (demand.beds_per_1000 alternatifi) ve 'mevcut hastane yataklarının kullanım etkinliği yükseltilecektir' diyor; GÖREN
    yatak devir hızını izliyor. ÖNEMLİ: 2025'te gerçekleşen doluluk %54,5 olduğundan Hill-Burton (%85) oran yöntemine
    göre ≈%36 daha az yatak verir. Aralık (0,50–0,95) varsayımdır.

