# Alan: saglik — A. Talep (spec 4.4 A): oran yöntemi ve Hill-Burton girdileri
# Kaynaklar: data/sources/saglik.yaml ; ayrıntılı tablo: data/reference/saglik_istatistikleri.csv
# Varsayılan yıl 2025 (öğrenci kararı: SİY 2025 Haber Bülteni); 2024 ve 2023 alternatif.
# Oranlar 0–1 arası kesir olarak tutulur (arayüz % gösterebilir).
# Hill-Burton: yatak = nüfus × yatış oranı × ortalama kalış / (365 × hedef doluluk). Formülün okunmuş kaynakları
# (data/reference/literatur.yaml): nates2023 Table 2 ('Hill-Burton formula') ve ravaghi2020 Table 4 ('Formula method').

- key: demand.beds_per_1000
  label: "1000 kişiye düşen hastane yatağı (oran yöntemi)"
  value: 3.15
  unit: "yatak / 1000 kişi"
  status: hesap
  source_ids: [saglik_sbsgm_bulten2025]
  derivation: "Türkiye 2025: 31,5 yatak / 10.000 kişi (SİY 2025 Haber Bülteni, Tablo 11, PDF s. 7) ÷ 10 = 3,15"
  range: [2.0, 5.0]
  alternatives:
    - {label: "2025, sayılardan tam değer: 270.829 yatak / 86.092.168 kişi × 1000", value: 3.1458, status: hesap, source_ids: [saglik_sbsgm_bulten2025, tuik_bt_adnks2025_yogunluk, tuik_haber_karar_adnks2025]}
    - {label: "2024: 31,3 / 10 (Haber Bülteni 2024 Tablo 12; SİY 2024 Tablo 7.20)", value: 3.13, status: hesap, source_ids: [saglik_sbsgm_bulten2024, saglik_sbsgm_siy2024]}
    - {label: "2023: 31,2 / 10 — şartname Bölüm 3 değeri (SİY 2023 Tablo 7.19)", value: 3.12, status: hesap, source_ids: [saglik_sbsgm_siy2023]}
    - {label: "2025, yoğun bakım yatakları hariç: (270.829 − 48.360) / 86.092.168 × 1000", value: 2.5841, status: hesap, source_ids: [saglik_sbsgm_bulten2025, tuik_bt_adnks2025_yogunluk, tuik_haber_karar_adnks2025]}
    - {label: "Ankara 2024: 42,5 / 10 (SİY 2024 Tablo 7.20; il dışından gelen hastaları da karşılıyor)", value: 4.25, status: hesap, source_ids: [saglik_sbsgm_siy2024]}
    - {label: "Ankara 2023: 43,1 / 10 (SİY 2023 Tablo 7.19)", value: 4.31, status: hesap, source_ids: [saglik_sbsgm_siy2023]}
    - {label: "Sağlık Bakanlığı 2024–2028 Stratejik Planı hedefi, 2028: 38 / 10 (PG4.2.1, tüm sektörler; başlangıç 30,7 (2022))", value: 3.8, status: hesap, source_ids: [saglik_sb_stratejik_plan_2024_2028]}
  notes: >-
    Şartname 4.4 A varsayılanı 3,12 (2023) idi; öğrencinin kararıyla varsayılan 2025'e (3,15) geçti, 3,12 resmî
    yıllıkla doğrulandı ve alternatif olarak duruyor. Tanım: SİY'de 'hastane yatağı' yoğun bakım, prematüre/yenidoğan
    (kuvöz, açık bebek yatağı), yanık ve nitelikli yatakları İÇERİR (SİY 2024 Bölüm 7 açıklamaları, PDF s. 193).
    Aralık gerekçesi: Türkiye yoğun bakım hariç (2,58) ile Ankara (4,25–4,31) değerlerini kapsar.
    Ankara 5.910.320 kişi ile oran yöntemi: 3,15 → 18.618 yatak (3,12 → 18.440).
    Resmî hedef: Stratejik Plan 2024–2028 PG4.2.1 '10.000 Kişiye Düşen Hastane Yatağı Sayısı (Tüm Sektörler)' yıllık
    hedefleri 32,5 / 34,5 / 36 / 37 / 38 (2024–2028; PDF s. 156); 2025 hedefi 34,5 iken gerçekleşen 31,5. Hedef bir
    politika hedefidir, talep ölçüsü değildir; yalnız karşılaştırma için alternatif olarak eklendi.

- key: demand.safety_margin
  label: "Kapasite emniyet payı"
  value: 0.0
  unit: "oran (0–1; 0,10 = %10 ek yatak)"
  status: varsayim
  rationale: >-
    Kaynaklı bir emniyet payı bulunamadı. Varsayılan 0: Hill-Burton modunda hedef doluluk (%85) zaten yatakların
    %15'ini boş tutarak dalgalanma payı bırakıyor; oran modunda ise gözlenen yatak/nüfus oranı Türkiye'nin mevcut
    düşük doluluğunu (%54,5) içerdiği için ayrıca pay eklemek talebi iki kez şişirir. Kaydırıcı duyarlılık analizi için.
  range: [0.0, 0.3]
  notes: "Aralık (0–%30) varsayımdır; tornado analizinde ±%20 yerine mutlak 0 → 0,2 denenebilir."

- key: demand.hb.admissions_per_1000
  label: "Yatış oranı (1000 kişi başına yıllık yatan hasta)"
  value: 158.23
  unit: "yatan hasta / 1000 kişi / yıl"
  status: hesap
  source_ids: [saglik_sbsgm_bulten2025, tuik_bt_adnks2025_yogunluk, tuik_haber_karar_adnks2025]
  derivation: >-
    Türkiye 2025: yatan hasta ≈ yatak devir hızı 50,3 (SİY 2025 Haber Bülteni Tablo 16, PDF s. 10) × hastane yatağı
    270.829 (Tablo 7, PDF s. 5) = 13.622.699; ÷ nüfus 86.092.168 (TÜİK ADNKS 31.12.2025) × 1000 = 158,23.
    Tanım (SİY 2024 Bölüm 8 açıklamaları): devir hızı = (taburcu + ölen) / yatak; yatan hasta = taburcu + ölen.
  range: [100, 250]
  alternatives:
    - {label: "Türkiye 2024: 13.881.750 / 85.664.944 × 1000 (SİY 2024 Tablo 8.26 ve 1.3)", value: 162.05, status: hesap, source_ids: [saglik_sbsgm_siy2024]}
    - {label: "Türkiye 2023: 13.391.434 / 85.372.377 × 1000 (SİY 2023 Tablo 8.25 ve 1.3)", value: 156.86, status: hesap, source_ids: [saglik_sbsgm_siy2023]}
    - {label: "Ankara 2024: 1.063.851 / 5.864.049 × 1000 (SİY 2024 Tablo 8.26 ve 1.3)", value: 181.42, status: hesap, source_ids: [saglik_sbsgm_siy2024]}
    - {label: "Ankara 2023: 998.148 / 5.803.482 × 1000 (SİY 2023 Tablo 8.25 ve 1.3)", value: 171.99, status: hesap, source_ids: [saglik_sbsgm_siy2023]}
  notes: >-
    2025 bülteni yatan hasta sayısını doğrudan vermiyor; devir hızı (50,3; ±0,05 yuvarlama → ±%0,1) ile türetildi.
    Doluluk/kalış üzerinden türetme (0,545 × 270.829 × 365 / 4,0 = 13,47 M) yuvarlama nedeniyle daha belirsiz (±%1,3).
    Ankara değerleri hizmetin verildiği ile göre: başka illerden gelen yatışları da içerir (Ankara üçüncü basamak
    merkezi; yorum), bu yüzden Ankara sakinlerinin talebini olduğundan yüksek gösterebilir → varsayılan Türkiye.
    Aralık (100–250) varsayımdır: kaynaklı değerlerin (156,9–181,4) her iki yanına geniş pay.

