    - {label: "Türkiye 2023 (SİY 2023 Tablo 8.25)", value: 0.582, status: kaynakli, source_ids: [saglik_sbsgm_siy2023]}
    - {label: "Ankara 2024 (SİY 2024 Tablo 8.26)", value: 0.595, status: kaynakli, source_ids: [saglik_sbsgm_siy2024]}
    - {label: "Ankara 2023 (SİY 2023 Tablo 8.25)", value: 0.566, status: kaynakli, source_ids: [saglik_sbsgm_siy2023]}
