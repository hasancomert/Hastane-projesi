  year: 2020
  title: 'Models and methods for determining the optimal number of beds in hospitals and regions: a systematic scoping review'
  journal: BMC Health Services Research
  publisher: Springer Science and Business Media LLC
  volume: '20'
  issue: '1'
  pages: '186'
  doi: 10.1186/s12913-020-5023-z
  url: https://doi.org/10.1186/s12913-020-5023-z
  verified_via: 'Crossref REST API (api.crossref.org/works/10.1186/s12913-020-5023-z); tür journal-article; basılı 2020-12,
    çevrimiçi 2020-03-06; tam metin: PMC OAI-PMH JATS XML (PMC7060560, data/raw/literatur/pmc/pmc_oai_PMC7060560_ravaghi2020.xml)'
  notes: 'Yatak ihtiyacı modellerinin sistematik taraması (Hill-Burton formülünün girdileri için). Crossref özetinden birebir:
    "Common determinants of the required number of hospital beds in these models included demographic changes, average length
    of stay, admission rates, and bed occupancy rates." Tam metin PMC''den okundu (PMC7060560, lisans OpenAccess). Table
    4''teki ''Formula method'' yatak ihtiyacını (ort. kalış × yatış oranı × öngörülen nüfus) / (dönem süresi × hedef doluluk)
    olarak veriyor: dönem 365 gün alınınca modeldeki Hill-Burton formülüyle (yatak = nüfus × yatış oranı × ort. kalış /
    (365 × hedef doluluk)) aynı yapı. Makale ''Hill-Burton'' adını ANMIYOR ve yöntemi 1984''e tarihliyor (Table 4: ''Introduced
    in 1984''). Hedef doluluk büyük hastanelerde %80–85, küçüklerde %45 (Table 4 ve Discussion; makalenin kaynağı [4]).
    Alıntılar: quotes alanı.'
  source_ids:
  - alan_literatur_lit_ravaghi2020
  pmcid: PMC7060560
  quotes:
  - where: Table 4 ('General characteristics of identified models and methods used to determine required numbers of hospital
      beds'), 'Formula method' satırı
    quote: Calculated by dividing the total length of stay (average length of stay × admission rate × projected population
      size) by (period duration × target bed occupancy rate)
  - where: Table 4, 'Formula method' satırı
    quote: Based on target occupancy rates (80–85% for large hospitals and 45% for small hospitals)
  - where: Table 4, 'Formula method' satırı
    quote: Introduced in 1984
  - where: Discussion
    quote: the target bed occupancy rate is usually considered to be 80–85% of the total bed capacity for large hospitals,
      and 45% for small hospitals (due to lack of economies of scale)
  - where: Discussion
    quote: The formula method which considers target bed occupancy rates is used as the foundation for many models.
