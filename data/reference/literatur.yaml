  journal: BMC Health Services Research
  publisher: Springer Science and Business Media LLC
  volume: '20'
  issue: '1'
  pages: '186'
  doi: 10.1186/s12913-020-5023-z
  url: https://doi.org/10.1186/s12913-020-5023-z
  verified_via: Crossref REST API (api.crossref.org/works/10.1186/s12913-020-5023-z); tür journal-article; basılı 2020-12,
    çevrimiçi 2020-03-06
  notes: 'Yatak ihtiyacı modellerinin sistematik taraması (Hill-Burton formülünün girdileri için). Crossref özetinden birebir:
    "Common determinants of the required number of hospital beds in these models included demographic changes, average length
    of stay, admission rates, and bed occupancy rates." Tam metin (link.springer.com, PMC) vekil sunucuda engelli → makalenin
    Hill-Burton formülünü adıyla anıp anmadığı DOĞRULANAMADI. Formülün kendisi (yatak = nüfus × yatış oranı × ort. kalış
    / (365 × hedef doluluk)) bu nedenle okunmuş bir akademik kaynağa bağlanamadı; formül, yatılan gün = yatak × 365 × doluluk
    tanımının (SİY bülteni tanımı, saglik alanı) cebirsel tersidir.'
