- id: maliyet_balcali_2019
  title: "Hastane Yapıları Teknik ve Destek Hizmet Birimlerinin Mekânsal Büyüklük Analizi: Çukurova Üniversitesi Tıp Fakültesi Balcalı Hastanesi Örneği"
  publisher: "Durgun Şahin, Y. — Çukurova Üniversitesi Mühendislik Mimarlık Fakültesi Dergisi 34(4), 203–216 (2019); doi:10.21605/cukurovaummfd.704217"
  url: "https://dergipark.org.tr/tr/download/article-file/1007709"
  accessed: 2026-10-21
  published: 2019-12-31
  kind: akademik
  archived: data/raw/maliyet/dergipark_704217_balcali.pdf
  sha256: "0d669b56c87a6e43916957992f5f7a97dc81af1ee60905eb0997d9324f96d224"
  used_for:
    - "2010 Kılavuzu alıntısı: 'İhtisas hastaneleri asgari alan büyüklüğü yatak sayısı ile 130 m²'nin çarpımı sonucu bulunur'; 1200 yatak için 156.000 m² (s. 211)"
    - "'Halen yürürlükte olan imar mevzuatında yatak başına en az 130 m²'; dünyada 150–200 m²'ye kadar (s. 211)"
    - "Balcalı: ≈1200 yatak, toplam kapalı alan 190.651 m² (Çizelge 2; 22.012 m² katlı otopark ve 149.164 m² ana bina dahil), 95.000 m² açık alan (s. 205, 211)"
    - "190651/1200 = 158,87 m²/yatak (s. 212)"
    - "Teknik ve destek hizmet birimleri toplamı 27.326 m² = bina içi 8.895 + bina içi %40 sirkülasyon 3.558 + bina dışı 14.873 (Çizelge 4, s. 214); toplam kapalı alanın ≈%14,3'ü (s. 215)"
    - "Birim örnekleri: mutfak ≈1.350 m² (1200 yatak için standart 1.800 m², 1,5 m²/hasta), çamaşırhane 870–898 m², klima santralleri 1.280→2.650 m², elektrik-tesisat 400→580 m², arşiv 2.150 m² (s. 209–210)"
  notes: >-
    Spec kaynağı [11]. Sayfa numaraları dergi sayfasıdır (PDF s. = dergi s. − 202). Özet '1200 yataklı hastaneler için
    belirlenmiş olan, yatak başına asgari 130 m²' diyor; metindeki alıntı ise standardı 'İhtisas hastaneleri' için veriyor
    — '1200' Balcalı'nın yatak sayısıdır, kılavuzda bir yatak sınıfı değildir. Dergi açılış sayfası da arşivlendi:
    data/raw/maliyet/dergipark_704217_balcali.html (sha256 401993ae…).

