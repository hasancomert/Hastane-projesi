    Kapsam cümleleri JSON'da metadatas[0].data[0].detail[1] ('Verinin kapsamı'); bülten metninin dipnotu (1) aynı
    kapsam dışı kuralını "90 günden kısa süreli" diye yazıyor. pipeline/10_tuik_population.py iki cümleyi arşivden
    okuyup yazdırır. API 'X-Requested-With: XMLHttpRequest' başlığı olmadan 404 döner.

