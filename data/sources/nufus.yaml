    - "Kapsam dışı (metaveri, 'Verinin kapsamı'): 'Kurs, turizm, bilimsel araştırma vb. nedenlerle 3 aydan kısa süreli vize veya ikamet iznine sahip yabancılar ile geçici koruma statüsüyle ülkede bulunan Suriyeliler nüfusa dâhil değildir.'"
