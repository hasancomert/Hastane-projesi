- id: sinirlar_secim_hesap
  title: "Sınır kümelerinin karşılaştırması ve ana küme seçimi (EPSG:6933 alanlar, IoU, UTM 36N sınır sapması)"
  publisher: "Bu proje (pipeline/11_boundaries.py)"
  url: "data/processed/sinir_karsilastirma.csv"
  accessed: 2026-10-21
  kind: hesap
  archived: data/raw/sinirlar/sinir_ozet.json
  used_for:
    - "Ankara il alanı (EPSG:6933 eşit alan): geoBoundaries 25.647,90 km²; Kontur 25.568,17 km²; COD-AB 25.631,76 km²"
    - "25 ilçe alanları (ankara_ilceler.geojson 'area_km2'; toplam 25.647,90 km²)"
    - "İl poligonu IoU (geoBoundaries'e göre): Kontur 0,9915; COD-AB 0,9524"
    - "İlçe IoU: Kontur medyan 0,989 (en düşük Şereflikoçhisar 0,927); COD-AB medyan 0,847 (en düşük Güdül 0,720)"
    - "İl sınırı sapması (COD-AB sınırından geoBoundaries sınırına, UTM 36N): medyan 431 m, %90'lık 2.222 m; çevre 1.132 km (geoBoundaries 1.590 km)"
    - "Web sürümü: 302.616 bayt (il 64.826 + ilçeler 237.790), 11.742 köşe, IoU en düşük 0,9974"
  notes: >-
    ANA KÜME: geoBoundaries gbOpen. Gerekçe: (1) güncellik — OSM kaynaklı, 2023 (ADM2 2023-01-19, ADM1 2023-08-31);
    (2) ayrıntı — il çevresi 1.590 km, COD-AB'nin 1:1.000.000 genellemesinde 1.132 km ve sınır sapması medyan 431 m;
    (3) tutarlılık — 25 ilçenin birleşimi il poligonuyla örtüşüyor (boşluk/bindirme yok), adlar Türkçe karakterli;
    (4) açık lisans (ODbL/CC BY; COD-AB üst verisinde 'yalnız insani kullanım' notu var). Resmî otorite açısından COD-AB
    (HGK) üstündür, ama ölçek ve tarih (2014) nedeniyle ızgara hesabı için kaba; il alanı özniteliği 25.631,76 km² spec
    [5]'teki 25.632 km² ile aynıdır. Kontur aynı OSM kaynağından (2023-06-28) ve geoBoundaries'e çok yakın (sınır sapması
    medyan ≈0 m); farkların çoğu Tuz Gölü kıyısında (Şereflikoçhisar −111,5 km²). Alanlar EPSG:6933'te (common.CRS_EQUAL_AREA).
    Web sadeleştirmesi: ortak sınırlar tek yay olarak Douglas–Peucker (0,0004°) ile sadeleştirildi, 5 ondalığa yuvarlandı,
    poligonlar yeniden kuruldu (komşular arasında boşluk/bindirme yok).
