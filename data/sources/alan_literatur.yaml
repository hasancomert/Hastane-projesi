- id: alan_literatur_hgm_il_ilce_yuzolcumleri
  title: İl ve İlçe Yüz Ölçümleri (il_ilce_alanlari.xlsx) — 2026 yılında üretilen 1:1.000.000 ölçekli Türkiye Mülki İdare
    Bölümleri Haritasından hesaplanmış
  publisher: T.C. Millî Savunma Bakanlığı, Harita Genel Müdürlüğü (HGM) — harita.gov.tr
  url: https://www.harita.gov.tr/uploads/files-folder/il_ilce_alanlari.xlsx
  accessed: 2026-10-21
  kind: resmi
  archived: data/raw/alan/hgm/il_ilce_alanlari.xlsx
  sha256: e6054762f2e03e72b56ef85cb430ea00b012ccc5eba3a8fea08e3a631d3b6447
  used_for:
  - 'Ankara yüzölçümü: 25.664 km² — belirtilmemiş (HGM: 1:1.000.000 ölçekli harita sınırlarından hesaplanmış, ''itibari'')
    [Sayfa1, satır 83 (sütun C ''İL / İLÇE'', D ''ALAN (km²)''); açıklama: hücre A2]'
  - Ankara'nın 25 ilçesinin yüzölçümü (Sayfa1 satır 84–108; toplam 25.664 km²) → data/reference/ankara_ilce_alanlari_hgm.csv
  - 'Türkiye: "Türkiye yüz ölçümü itibari olarak 780 043 km²’dir." (son satır)'
  notes: 'Sayfa https://www.harita.gov.tr/il-ve-ilce-yuzolcumleri (arşiv: data/raw/alan/hgm/hgm_il_ve_ilce_yuzolcumleri.html):
    "İl ve İlçe Yüz ölçümlerini XLSX (Excel) formatında indirmek için tıklayınız." "Türkiye yüz ölçümü itibari olarak 780.043
    km²’dir." "Bu haritadaki ülke, il ve ilçe sınırları gösterim amaçlı farklı kaynaklardan itibari olarak türetilmiştir,
    bu ve bu veri kullanılarak türetilen hiçbir veri resmî nitelik taşımamaktadır." Tablo açıklaması (A2): "AÇIKLAMA: Aşağıda
    verilen yüz ölçümleri; 2026 yılında üretilen 1:1.000.000 ölçekli Türkiye Mülki İdare Bölümleri Haritasından yararlanılarak
    hesaplanmıştır. Bu haritadaki ülke, il ve ilçe sınırları ile bunlardan hesaplanan yüz ölçümleri itibaridir, resmî nitelik
    taşımamaktadır. İl ve ilçe yüz ölçümleri Harita Genel Müdürlüğü tarafından her yıl güncellenmektedir. İl, ilçe ve bucak
    bağlılıklarının ve sınırlarının belirlenmesi, değiştirilmesi ve yayımlanması yetki ve sorumluluğu 5442 Sayılı İl İdaresi
    Kanunu gereği İçişleri Bakanlığında bulunmaktadır." Yani değerler itibari ve her yıl güncelleniyor; Ankara 25.664 km²,
    25.632 km²''yi DOĞRULAMIYOR (+32 km²). Dosya özellikleri: oluşturma 2021-03-11, son değişiklik 2026-06-16 (docProps).
    Eski PDF adresi (https://www.harita.gov.tr/images/urun/il_ilce_alanlari.pdf) 21.10.2026''da HGM''nin /404 sayfasına
    yönleniyor. Tabloda göl dahil/hariç bilgisi yok.'

