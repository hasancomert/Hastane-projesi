- id: arazi_osm_circuity_hesap
  title: "Ankara yol ağı dolambaç katsayısı ölçümü (OSM + GHS-POP; bu proje, pipeline/15_circuity.py)"
  publisher: "Proje hesabı"
  url: "pipeline/15_circuity.py"
  accessed: 2026-10-21
  kind: hesap
  archived: data/reference/circuity_ankara.csv
  used_for:
    - "access.circuity varsayılanı 1,223 = kuş uçuşu 5–40 km çiftlerinin nüfus ağırlıklı ortalaması (n = 2.394)"
    - "Bant bazında nüfus ağırlıklı ortalamalar: 0–5 km 1,384; 5–10 km 1,281; 10–20 km 1,232; 20–40 km 1,185; 40–80 km 1,204; 80+ km 1,181; tüm çiftler 1,236"
    - "5–40 km köken kentsel (9 merkez ilçe) 1,222 (n = 2.177); köken kırsal (16 ilçe) 1,262 (n = 217)"
  notes: >-
    4.800 çift çekildi, 4.761'i geçerli (bağlantı > 1 km veya bağlanan düğümler arası < 500 m olanlar atıldı).
    Köken ∝ nüfus (800 çekiliş, tohum 20261021); her köken için 6 mesafe bandının her birinden bir hedef ∝ nüfus;
    ağırlık w = kökenin o banttaki toplam nüfusu (ters olasılık ağırlığı → rastgele iki kişi arası yolculuk).
    Yönlü graf (tek yön kuralları), derece-2 düğümler daraltıldı (218.578 düğüm). Hücreler en yakın
    motorway/trunk dışı düğüme bağlandı (otoyola bağlanma yapay dolambaç üretiyordu). Nüfuslu hücrelerin %12,8'i
    (nüfusun %0,21'i) 1 km içinde araç yoluna bağlanamadı. Kentsel = Altındağ, Çankaya, Etimesgut, Gölbaşı,
    Keçiören, Mamak, Pursaklar, Sincan, Yenimahalle (model seçimi). Grafik: data/processed/circuity_ankara.png;
    çift listesi: data/raw/osm/circuity_pairs.csv.
