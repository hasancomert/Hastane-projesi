- id: arazi_osm_worldcover_tiles_s3
  title: "ESA WorldCover 10 m 2021 v200 — 3°×3° harita karoları N39E030, N39E033, N36E033, N36E030 (COG)"
  publisher: "ESA WorldCover projesi (AWS S3 açık veri kovası esa-worldcover)"
  url: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/"
  accessed: 2026-10-21
  kind: veri
  archived: data/raw/arazi/
  used_for:
    - "data/processed/landcover/worldcover_ankara_100m.tif: GHS-POP 100 m ızgarasında (ESRI:54009, common.GHS_WINDOW, 2920×2390 hücre) bant1 = %su(80), bant2 = %sulak alan(90), bant3 = %yapılaşma(50)"
    - "Ankara il geneli (geoBoundaries il poligonu, alanı EPSG:6933'te 25.647,90 km²; hücre merkezi poligonda olan 100 m hücreler, jeodezik hücre alanıyla): kalıcı su 748,4 km² (%2,92); otsu sulak alan 2,4 km² (%0,01); yapılaşmış alan 648,4 km² (%2,53)"
    - "Sağlama, Ankara içindeki su alanı (100 m ürün / 10 m jeodezik): Tuz Gölü 450,1 / 450,0 km²; Hirfanlı 142,9 / 142,9; Sarıyar 43,4 / 43,3; Kesikköprü 0,99 / 0,99; Mogan 5,68 / 5,67; Eymir 1,23 / 1,23 km²"
  notes: >-
    Karo dosyaları ve sha256: N39E030 6983e9f66fcd8685f1dd161cb304bb0530f05a879fee8be95c33a474b429ffaf;
    N39E033 e2f53b734e0fcecff6660061573b4f9b804b5dbe6920c1d476b75cb9af1f070f;
    N36E033 6009be27026a4782800629c38a490cae8573c20d1e602805bdbe0c17ca1872d3;
    N36E030 37b4c62415a5f81d54a19d8b907a84cbae7aa4aaf148de049f7fc7d55ad9b5ff (S3 Last-Modified 2022-10-26).
    Yöntem: her sınıf için 10 m ikili maske, GDAL 'average' (kısmi piksel ağırlıklı) ile 100 m Mollweide'e
    yeniden örneklendi; bant değerleri hücre alanının yüzdesidir, hücre alanından bağımsızdır. Hücre alanı: PROJ'un
    Mollweide'i (ESRI:54009) WGS84'te küre formülüyle (yarıçap = a) çalışır, elipsoit üzerinde eşit alanlı değildir;
    Ankara'da 100 m hücre jeodezik olarak ≈9.985–9.990 m², tam 1 ha DEĞİL (hücre sayısı × 1 ha il alanını ≈%0,12
    fazla verir). Bu yüzden km² toplamları satır başına jeodezik hücre alanıyla (pipeline/13_landcover.py) hesaplanır;
    poligon alanları EPSG:6933'te hesaplanmalıdır (geoBoundaries il poligonu 25.647,90 km²; poligonda merkezi olan
    hücrelerin jeodezik toplamı 25.647,83 km²). WorldCover yüzde değerleri ve nüfus ızgaraları (hücre başına kişi)
    bundan etkilenmez. Alan doğruluğu (jeodezik hücre alanıyla): 6 gölde 100 m ürün ile 10 m piksellerin elipsoit
    alanı farkı pencere içinde ≤ %0,19 (Mogan), Ankara içi kısımda ≤ %0,51 (Kesikköprü; Ankara içi ≈1 km², sınır
    etkisi); Tuz Gölü ve Hirfanlı'da ≤ %0,02. Veri seti künyesi: alan_literatur_lit_zanaga2022. Göl poligonları OSM'den (Tuz Gölü relation/2411676, Hirfanlı
    relation/1028112, Sarıyar relation/385113, Kesikköprü relation/2280078, Mogan relation/2280277, Eymir
    way/729243281), 300 m tamponlu; "Ankara içi" = geoBoundaries ADM1 ile kesişim. OSM göl alanları (tamamı /
    Ankara içi, km²): Tuz Gölü 939,8 / 450,3; Hirfanlı 222,0 / 140,7; Sarıyar 64,7 / 43,8; Kesikköprü 5,8 / 0,95;
    Mogan 5,69 / 5,69; Eymir 1,24 / 1,24. Ayrıntı: data/raw/arazi/worldcover_lake_check.csv.

