    devir hızı/aralığı) bu derlemeyle birebir aynı.
    Sağladığı tablo/sayfa referansları (SİY2024 Tablo 7.20 PDF s. 191–192, Tablo 8.26 PDF s. 233–236;
    SİY2023 Tablo 7.19 PDF s. 181–182, Tablo 8.25 PDF s. 223–226) bizim okumamızla aynı. 2025 verisi içermiyor.
