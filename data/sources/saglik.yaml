  sha256: "3a39bcdf77ccb05c0e38552aab0232c714189bae14aede70bacf47bd7f2542b9"
  used_for:
    - "Hastane sayısı 2025: 1.553 (Sağlık Bakanlığı 943, üniversite 70, özel 540) — Tablo 6"
    - "Hastane yatağı 2025: 270.829 (SB 172.079, üniversite 45.740, özel 53.010) — Tablo 7"
    - "Nitelikli yatak 184.965 (%83,1; yoğun bakım hariç) — Tablo 8; yoğun bakım yatağı 48.360 — Tablo 9"
    - "10.000 kişiye düşen hastane yatağı 2025: 31,5 — Tablo 11"
    - "Toplam hekime müracaat 1.138.060.185; kişi başı 13,2; birinci basamak %41,3, ikinci+üçüncü basamak %58,7 — Tablo 15 ve PDF s. 9 metni"
    - "Hastanelerde hekime müracaat 656.167.336 (kişi başı 7,6) — Tablo 15 ve Tablo 11 (PDF s. 7); ikinci+üçüncü basamak toplamı 667.703.533 (kişi başı 7,8) — Tablo 15"
    - "Yatak doluluk %54,5; ortalama kalış 4,0 gün; yatak devir hızı 50,3; devir aralığı 3,3 gün (Türkiye) — Tablo 16"
    - "Batı Anadolu (TR5) 2025: 138 hastane, 33.159 yatak, kişi başı müracaat 14,0, doluluk %59,5, kalış 4,3 gün, devir hızı 50,8 — Tablo 6, 7, 16"
  notes: >-
    13 sayfalık PDF; bülten içi sayfa numarası 'Sayfa n' = PDF sayfası − 1. Tablo 6: PDF s. 4; Tablo 7–8: PDF s. 5;
    Tablo 9: PDF s. 6; Tablo 11: PDF s. 7; Tablo 15 ve müracaat payları metni: PDF s. 9; Tablo 16: PDF s. 10.
    Bülten tarihi 30 Eylül 2026, saat 17:00 (her sayfanın başlığında; SBSGM duyurusu da 30 Eylül 2026); haberlerde
    01.10.2026 olarak geçiyor. Bülten il düzeyinde veri VERMİYOR (yalnız Türkiye ve İBBS-1 bölgeleri) ve yatan hasta
    sayısı / yatılan gün sayısı yayımlamıyor; bu nedenle 2025 yatan hasta sayısı devir hızı × yatak sayısından hesaplandı.
    Son sayfa notu: 'istatistikler TÜİK 2025 nüfusu baz alınarak uluslararası tanımlara göre hesaplandı'. İç tutarlılık:
    Tablo 14'teki acil yardım istasyonu başına nüfus (23.974) × istasyon sayısı (3.591, Tablo 12) = 86,09 milyon, yani
    bülten paydası TÜİK 31.12.2025 nüfusu 86.092.168 ile yuvarlama içinde tutarlı. UYARI: 2024'e göre doluluk 59,8 →
    54,5 ve ortalama kalış 4,2 → 4,0'a düştü (yatılan gün ≈ −%8); bültende yöntem değişikliği notu yok; Sağlık
    İstatistikleri Yıllığı 2025 (tam metin, il tabloları) henüz yayımlanmadı (21.10.2026 itibarıyla SBSGM yıllık listesi
    2024'te bitiyor). Tam yıllık çıkınca yeniden kontrol edilmeli.

